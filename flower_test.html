<!DOCTYPE html>
<html>
<head>
<style>
.flower {
  width: 300px;
  height: 300px;
  background: gold;
  position: relative;
  /* Simple puffy flower using multiple boxes/circles */
}
.flower::before, .flower::after {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: inherit;
  border-radius: 40%;
}
.flower::before { transform: rotate(30deg); }
.flower::after { transform: rotate(60deg); }

.flower-center {
  position: absolute;
  top: 10%; left: 10%; width: 80%; height: 80%;
  background: yellow;
  border-radius: 50%;
  z-index: 1;
}
</style>
</head>
<body>
<div class="flower"><div class="flower-center"></div></div>
</body>
</html>
